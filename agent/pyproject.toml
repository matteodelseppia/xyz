[project]
name = "xyz-agent"
version = "0.1.0"
description = "Daily annotated feed digest workflow"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35,<2",
  "defusedxml>=0.7,<1",
  "jinja2>=3.1,<4",
  "langgraph>=0.6,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dateutil>=2.9,<3",
  "structlog>=24.4,<26",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  "types-python-dateutil>=2.9,<3",
  "boto3-stubs[s3]>=1.35,<2",
]

[project.scripts]
xyz-agent = "xyz_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xyz_agent"]
