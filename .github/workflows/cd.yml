name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  RAILWAY_PROJECT_ID: f8e6f1b0-e7f6-477c-9cb1-ef65435242c3
  RAILWAY_ENVIRONMENT: production
  RAILWAY_WEB_SERVICE: xyz-web
  RAILWAY_AGENT_SERVICE: xyz-agent
  RAILWAY_CLI_VERSION: 5.45.10

jobs:
  production:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Railway CLI
        run: |
          curl --fail --silent --show-error --location --output railway.tar.gz \
            "https://github.com/railwayapp/cli/releases/download/v${RAILWAY_CLI_VERSION}/railway-v${RAILWAY_CLI_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf railway.tar.gz railway
          sudo install -m 0755 railway /usr/local/bin/railway
          rm -f railway.tar.gz railway
          railway --version

      - name: Record source revision
        run: railway variable set "XYZ_SOURCE_REVISION=${{ github.event.workflow_run.head_sha }}" --service "$RAILWAY_AGENT_SERVICE" --skip-deploys
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}

      - name: Deploy web service
        run: railway up --ci --service "$RAILWAY_WEB_SERVICE" -m "Deploy ${{ github.event.workflow_run.head_sha }}"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}

      - name: Deploy scheduled agent
        run: railway up --ci --service "$RAILWAY_AGENT_SERVICE" -m "Deploy ${{ github.event.workflow_run.head_sha }}"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}

      - name: Smoke test web service
        env:
          BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          for attempt in $(seq 1 18); do
            status=$(curl --silent --show-error --output health.json --write-out '%{http_code}' "$BASE_URL/health" || true)
            if { [ "$status" = 200 ] || [ "$status" = 503 ]; } && grep --quiet '"ok":' health.json; then
              echo "Web service is reachable (health status $status)."
              exit 0
            fi
            sleep 5
          done
          echo "Web service did not become reachable." >&2
          exit 1
