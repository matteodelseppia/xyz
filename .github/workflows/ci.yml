name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.28"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
      - run: uv sync --all-extras --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy agent/src
      - run: uv run pytest
      - name: Verify fixture publication contains no secrets or fetched bodies
        run: |
          XYZ_RUNTIME=fake XYZ_STORAGE_ROOT="$RUNNER_TEMP/artifacts" uv run xyz-agent --date 2026-01-02
          ! grep -R -E 'OPENROUTER_API_KEY|A deterministic fixture entry' "$RUNNER_TEMP/artifacts/runs"

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test pi-extension/tests web/tests
      - run: npm audit --omit=dev --audit-level=high

  images:
    runs-on: ubuntu-latest
    needs: [python, typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent/Dockerfile
          push: false
          load: true
          tags: xyz-agent:${{ github.sha }}
      - name: Verify agent image editorial anchors
        run: >-
          docker run --rm --entrypoint python xyz-agent:${{ github.sha }}
          -c "from xyz_agent.config import Settings; assert Settings().editorial_anchors()"
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
          tags: xyz-web:${{ github.sha }}
